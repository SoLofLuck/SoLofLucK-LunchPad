name: Crank (graduate completed curves)

# Anyone can graduate a completed curve from the token page; this keeps it
# automatic. Needs the CRANK_KEY secret (a small hot wallet with a little SOL
# for fees) and the repository variables VITE_NETWORK / VITE_PROGRAM_ID.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: crank
  cancel-in-progress: false

jobs:
  crank:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          KEY: ${{ secrets.CRANK_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "${{ vars.VITE_PROGRAM_ID }}" ]; then
            echo "CRANK_KEY or VITE_PROGRAM_ID not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Graduate
        if: steps.check.outputs.skip != 'true'
        env:
          NETWORK: ${{ vars.VITE_NETWORK || 'devnet' }}
          PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID }}
          RPC_URL: ${{ secrets.VITE_RPC_URL }}
        run: |
          printf '%s' '${{ secrets.CRANK_KEY }}' > "$RUNNER_TEMP/crank.json"
          KEYPAIR="$RUNNER_TEMP/crank.json" node scripts/crank.mjs
          rm -f "$RUNNER_TEMP/crank.json"
