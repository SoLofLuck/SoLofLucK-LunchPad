name: Crank (graduate completed curves)

# Anyone can graduate a completed curve from the token page; this keeps it
# automatic. Uses the CRANK_KEY secret if set (a small hot wallet with a little
# SOL for fees), otherwise the deploy key. Network: the VITE_NETWORK variable
# (default devnet); program address: app/src/program-ids.json.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: crank
  cancel-in-progress: false

jobs:
  crank:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          KEY: ${{ secrets.CRANK_KEY || secrets.LAUNCHPAD_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No CRANK_KEY / LAUNCHPAD_DEPLOY_KEY secret; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Graduate
        if: steps.check.outputs.skip != 'true'
        env:
          NETWORK: ${{ vars.VITE_NETWORK || 'devnet' }}
          PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID }}
          KEY: ${{ secrets.CRANK_KEY || secrets.LAUNCHPAD_DEPLOY_KEY }}
          RPC_URL: ${{ secrets.VITE_RPC_URL }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/crank.json"
          KEYPAIR="$RUNNER_TEMP/crank.json" node scripts/crank.mjs
          rm -f "$RUNNER_TEMP/crank.json"
