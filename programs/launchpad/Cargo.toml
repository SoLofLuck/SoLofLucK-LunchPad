[package]
name = "launchpad"
version = "0.1.0"
description = "SoLofLuck LaunchPad: bonding-curve token launches with an on-curve Sell Lock, a Creator Lock and permissionless graduation to Raydium CPMM."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Skips the "only the program's upgrade authority may initialize the config"
# check. The in-process test harness runs the program natively, without a
# ProgramData account, so it cannot satisfy that check. NEVER enable this for a
# deployed build — CI builds without it.
local-testing = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
solana-program-test = "2.1"
solana-sdk = "2.1"
spl-token-2022 = { version = "6", features = ["no-entrypoint"] }
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Anchor's macros reference cfgs this crate does not declare.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
